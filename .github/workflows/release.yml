# release-please keeps a release PR open against main and cuts the tag and GitHub release when it
# merges; the npm job then publishes that tag. Both live in this one workflow, because events
# created with GITHUB_TOKEN never trigger other workflows.

name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publishes through npm trusted publishing, so no token is stored: the package must list this
  # workflow (release.yml) as its trusted publisher on npmjs.com. Release PRs never run CI, so the
  # tagged tree gets the CI gates first. A version already on the registry is skipped so a rerun
  # can finish.
  npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a trusted-publishing npm
        run: npm install --global npm@12.2.2

      - name: Check
        run: |
          set -eu
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck:bun
          bun run test
          bun run pack:check

      - name: Publish
        run: |
          set -eu
          name="@wyattjoh/herdr-ui"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already published"
            exit 0
          fi
          npm publish --access public
