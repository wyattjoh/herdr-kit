name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      ui_release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
      ui_tag_name: ${{ steps.release.outputs['packages/ui--tag_name'] }}
      ui_version: ${{ steps.release.outputs['packages/ui--version'] }}
      dev_release_created: ${{ steps.release.outputs['packages/dev--release_created'] }}
      dev_tag_name: ${{ steps.release.outputs['packages/dev--tag_name'] }}
      dev_version: ${{ steps.release.outputs['packages/dev--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Each package has its own npm trusted-publisher entry for this workflow.
  publish-ui:
    needs: release-please
    if: ${{ needs.release-please.outputs.ui_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release-please.outputs.ui_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.ui_tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a trusted-publishing npm
        run: npm install --global npm@12.2.2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check all packages (fast)
        run: bun run check:fast

      - name: Publish UI package
        working-directory: packages/ui
        run: |
          set -eu
          name="@wyattjoh/herdr-ui"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already published"
            exit 0
          fi
          npm publish --access public

  publish-dev:
    needs: release-please
    if: ${{ needs.release-please.outputs.dev_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release-please.outputs.dev_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.dev_tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a trusted-publishing npm
        run: npm install --global npm@12.2.2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check all packages (fast)
        run: bun run check:fast

      - name: Publish dev package
        working-directory: packages/dev
        run: |
          set -eu
          name="@wyattjoh/herdr-dev"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already published"
            exit 0
          fi
          npm publish --access public
