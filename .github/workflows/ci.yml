# Checks every pull request and push to main with the parts of `bun run check` that run without
# an installed Herdr: formatting, lint, the Bun-side typecheck, tests and the package listing. The
# native typecheck (against Herdr's generated gpui-kit.d.ts and herdr.d.ts) and the gallery's
# `herdr-app check` need a Herdr home and stay local.

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install a trusted-publishing npm
        run: npm install --global npm@12.2.2

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        if: ${{ always() }}
        run: bun run lint

      - name: Typecheck (Bun side)
        if: ${{ always() }}
        run: bun run typecheck:bun

      - name: Test
        if: ${{ always() }}
        run: bun run test

      - name: Check the package listing
        if: ${{ always() }}
        run: bun run pack:check
